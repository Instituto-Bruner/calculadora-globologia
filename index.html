<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#4632c8">
  <title>Calculadora de Globología · Bruner × Happy Deco</title>
  <meta name="description" content="Costos, presupuestos y rentabilidad para decoración con globos.">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <header class="topbar">
    <button class="brand" data-go="home" aria-label="Ir al inicio"><span class="brand-logos"><img src="assets/instituto-bruner.png" alt="Instituto Bruner"><span>×</span><img src="assets/happy-deco.png" alt="Happy Deco"></span><span class="brand-title">Calculadora de <b>Globología</b></span></button>
    <nav id="mainNav" aria-label="Navegación principal"><button data-go="quick">Rápido</button><button data-go="basic">Básico</button><button data-go="expert">Experto</button><button data-go="profit">Rentabilidad</button><button data-go="estimator">Estimador</button><button data-go="budget">Presupuesto</button><button data-go="library">Materiales</button><button data-go="manual">Manual</button><button data-go="settings">Configuración</button></nav>
    <button id="menuBtn" class="icon-btn" aria-label="Abrir menú">☰</button>
  </header>
  <main id="app" tabindex="-1"></main>
  <div id="toast" class="toast" role="status"></div>
  <dialog id="helpDialog"><button class="dialog-close" data-close>×</button><h2 id="helpTitle"></h2><p id="helpText"></p></dialog>
  <dialog id="clientDialog" class="client-dialog"><button class="dialog-close no-print" data-close>×</button><div id="clientView"></div><div class="dialog-actions no-print"><button class="btn secondary" data-close>Cerrar</button><button class="btn primary" id="printClient">Imprimir / Guardar PDF</button></div></dialog>
  <dialog id="confirmDialog"><button class="dialog-close" data-close>×</button><h2>Confirmar trabajo</h2><div id="confirmStock"></div><div class="dialog-actions"><button class="btn secondary" data-close>Cancelar</button><button class="btn primary" id="applyStock">Confirmar y descontar stock</button></div></dialog>
  <script src="app.js?v=6"></script>
</body>
</html>
